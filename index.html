<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бюро: Смена стажёра</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; user-select: none; }
  body { background: #1a1a1a; height: 100vh; display: flex; justify-content: center; overflow: hidden; color: #000; }
  
  #game { width: 100%; max-width: 600px; height: 100%; display: flex; flex-direction: column; background: #d2c5b3; position: relative; }
  
  #hud { background: #3e2a1f; color: #e0d0c0; padding: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; border-bottom: 4px solid #5a3f2c; z-index: 5; }
  #date-display { color: #ffcc00; }
  #stats { display: flex; gap: 15px; }
  .stat-box { display: flex; flex-direction: column; align-items: flex-end; }
  .bar { width: 60px; height: 8px; background: #555; border: 1px solid #000; margin-top: 2px; }
  .bar-fill { height: 100%; background: #00ff00; transition: width 0.3s; }
  #anger .bar-fill { background: #ff3333; }

  /* Основной экран */
  #desk { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px; }
  
  #visitor-dummy { width: 80px; height: 120px; background: #999; border: 4px solid #444; border-radius: 20px 20px 0 0; position: relative; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; color: #333; font-weight: bold; font-size: 30px; }
  #visitor-dummy::before { content: '?'; }

  #speech-bubble { background: #fff; padding: 10px; border: 2px solid #000; border-radius: 10px; position: relative; max-width: 80%; text-align: center; margin-bottom: 20px; z-index: 10; }
  #speech-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-width: 10px 10px 0; border-style: solid; border-color: #fff transparent transparent; }
  
  #document-zone { width: 100%; max-width: 350px; background: #fff; border: 2px solid #000; padding: 15px; position: relative; box-shadow: 5px 5px 0 rgba(0,0,0,0.3); transform: rotate(-1deg); margin-bottom: 20px; z-index: 10; }
  #doc-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
  .doc-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  .doc-label { font-weight: bold; }
  .doc-value { border-bottom: 1px dotted #000; min-width: 120px; text-align: right; }
  .expired { color: #cc0000; font-weight: bold; }
  .valid { color: #006600; font-weight: bold; }

  #actions { display: flex; gap: 10px; width: 100%; max-width: 350px; z-index: 10; }
  button { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border: 2px solid #000; cursor: pointer; text-transform: uppercase; box-shadow: 2px 2px 0 #000; transition: 0.1s; }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  #btn-approve { background: #4caf50; color: #fff; }
  #btn-deny { background: #f44336; color: #fff; }
  #btn-ask-name { background: #2196f3; color: #fff; }

  #message { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: #000; color: #fff; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: none; z-index: 20; text-align: center; }
  .flash-red { animation: flashRed 0.5s; }
  .flash-green { animation: flashGreen 0.5s; }
  @keyframes flashRed { 0%, 100% { background-color: transparent; } 50% { background-color: rgba(255,0,0,0.3); } }
  @keyframes flashGreen { 0%, 100% { background-color: transparent; } 50% { background-color: rgba(0,255,0,0.3); } }

  #tasks { position: absolute; top: 60px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 15; }
  .task-card { background: #fff; border: 2px solid #000; padding: 5px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 5px; box-shadow: 2px 2px 0 #000; }
  .task-card .task-text { font-weight: bold; }
  .task-card .task-buttons { display: flex; gap: 5px; }
  .task-card button { padding: 2px 8px; font-size: 10px; flex: none; width: auto; box-shadow: none; }

  /* === МИНИ-ИГРА === */
  #minigame-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #2c2c2c; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50; padding: 20px; }
  #minigame-title { color: #fff; font-size: 20px; margin-bottom: 20px; text-align: center; }
  #minigame-area { width: 100%; max-width: 400px; height: 300px; background: #4a4a4a; border: 4px solid #000; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px; }
  .minigame-object { width: 40px; height: 50px; background: #fff; border: 2px solid #000; display: flex; justify-content: center; align-items: center; font-size: 10px; cursor: pointer; box-shadow: 2px 2px 0 #000; transition: transform 0.1s; }
  .minigame-object:active { transform: scale(0.9); }
  .minigame-object.done { background: #4caf50; color: #fff; border-color: #000; pointer-events: none; }
  #minigame-target { font-size: 16px; color: #fff; margin-top: 20px; }
  
  /* Пиксельные сотрудники для мини-игры (упрощенные) */
  .mini-char { width: 60px; height: 100px; position: absolute; bottom: 10px; right: 10px; }
  .mini-char .head { width: 24px; height: 24px; background: #f0c0a0; position: absolute; top: 0; left: 18px; border: 2px solid #000; border-radius: 4px; z-index: 2; }
  .mini-char .body { width: 40px; height: 60px; background: #333; position: absolute; top: 24px; left: 10px; border: 2px solid #000; z-index: 1; }
  .mini-char .hair { width: 28px; height: 12px; background: #4e342e; position: absolute; top: -4px; left: 16px; border: 2px solid #000; border-radius: 4px; z-index: 3; }

  #gameover { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); color: #fff; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; }
  #gameover h1 { color: #f44336; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="game">
  <div id="hud">
    <div>
      <div>Смена: Понедельник</div>
      <div id="date-display">20 марта 1920 г.</div>
    </div>
    <div id="stats">
      <div class="stat-box"><span>ЭНЕРГИЯ</span><div class="bar"><div id="energy-fill" class="bar-fill" style="width: 100%;"></div></div></div>
      <div class="stat-box" id="anger"><span>ГНЕВ БОССА</span><div class="bar"><div id="anger-fill" class="bar-fill" style="width: 0%;"></div></div></div>
      <div class="stat-box"><span>ВРЕМЯ</span><span id="time-display">09:00</span></div>
    </div>
  </div>

  <div id="desk">
    <div id="message"></div>
    <div id="tasks"></div>
    
    <div id="visitor-dummy"></div>
    <div id="speech-bubble">...</div>

    <div id="document-zone">
      <div id="doc-header">Бюро Магического Регулирования</div>
      <div class="doc-row"><span class="doc-label">Имя:</span> <span id="doc-name" class="doc-value">...</span></div>
      <div class="doc-row"><span class="doc-label">Номер:</span> <span id="doc-number" class="doc-value">...</span></div>
      <div class="doc-row"><span class="doc-label">Истекает:</span> <span id="doc-expiry" class="doc-value">...</span></div>
    </div>

    <div id="actions">
      <button id="btn-ask-name" onclick="askName()">Спросить имя</button>
      <button id="btn-approve" onclick="handleAction('approve')">Одобрить</button>
      <button id="btn-deny" onclick="handleAction('deny')">Отклонить</button>
    </div>
  </div>

  <!-- Экран мини-игры -->
  <div id="minigame-screen">
    <h2 id="minigame-title">Мини-игра</h2>
    <div id="minigame-area"></div>
    <div id="minigame-target">Цель: 0 / 0</div>
  </div>

  <div id="gameover">
    <h1>ВЫ УВОЛЕНЫ</h1>
    <p id="gameover-text">Мистер Морриган недоволен.</p>
    <button onclick="location.reload()" style="margin-top: 20px; width: 200px;">Начать заново</button>
  </div>
</div>

<script>
  let energy = 100;
  let anger = 0;
  let timeMinutes = 9 * 60;
  let isGameOver = false;
  let isPaused = false; // Пауза для мини-игр
  let currentVisitor = null;
  let hasAskedName = false;
  
  const gameDate = new Date(1920, 2, 20);
  
  const firstNames = ["Александр", "Дмитрий", "Сергей", "Андрей", "Алексей", "Максим", "Иван", "Михаил", "Артем", "Николай", "Владимир", "Павел", "Роман", "Егор", "Игорь", "Анна", "Мария", "Елена", "Ольга", "Наталья", "Ирина", "Татьяна", "Светлана", "Екатерина", "Джон", "Джеймс", "Роберт", "Майкл", "Уильям", "Дэвид", "Ричард", "Джозеф", "Томас", "Чарльз", "Мэри", "Патриция", "Дженнифер", "Линда", "Элизабет", "Барбара"];
  const lastNames = ["Смит", "Джонсон", "Уильямс", "Браун", "Джонс", "Гарсия", "Миллер", "Дэвис", "Родригес", "Мартинес", "Эрнандес", "Лопес", "Гонсалес", "Уилсон", "Андерсон", "Томас", "Тейлор", "Мур", "Джексон", "Мартин", "Ли", "Перес", "Томпсон", "Уайт", "Харрис", "Санчес", "Кларк", "Рамирес", "Льюис", "Робинсон"];

  function getRandomName() {
    return `${firstNames[Math.floor(Math.random() * firstNames.length)]} ${lastNames[Math.floor(Math.random() * lastNames.length)]}`;
  }

  function generateVisitor() {
    hasAskedName = false;
    document.getElementById('btn-ask-name').style.display = 'block';

    const realName = getRandomName();
    const docName = Math.random() < 0.2 ? getRandomName() : realName;
    const isDocFake = docName !== realName;
    
    const daysOffset = Math.floor(Math.random() * 21) - 10;
    const expiryDate = new Date(gameDate);
    expiryDate.setDate(gameDate.getDate() + daysOffset);

    currentVisitor = {
      realName: realName, docName: docName, expiry: expiryDate,
      isExpired: expiryDate < gameDate, isDocFake: isDocFake,
      wantsRenew: Math.random() < 0.5
    };

    let speech = "";
    if (currentVisitor.wantsRenew) speech = "Стажёр, мне нужно продлить лицензию. Вот моя бумага.";
    else speech = "Стажёр, проверьте мою лицензию. Мне сказали, что она действительна.";

    document.getElementById('speech-bubble').textContent = '— ' + speech;
    document.getElementById('doc-name').textContent = currentVisitor.docName;
    document.getElementById('doc-number').textContent = "БМР-" + Math.floor(1000 + Math.random() * 9000);
    
    const expiryStr = expiryDate.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const expiryEl = document.getElementById('doc-expiry');
    expiryEl.textContent = expiryStr;
    expiryEl.className = currentVisitor.isExpired ? 'doc-value expired' : 'doc-value valid';
  }

  window.askName = function() {
    if (isGameOver || hasAskedName || isPaused) return;
    hasAskedName = true;
    document.getElementById('btn-ask-name').style.display = 'none';
    document.getElementById('speech-bubble').textContent = `— Меня зовут ${currentVisitor.realName}. Вот моя лицензия.`;
  };

  window.handleAction = function(action) {
    if (isGameOver || isPaused) return;

    let isCorrect = false;

    if (currentVisitor.isDocFake) {
      isCorrect = (action === 'deny');
    } else if (currentVisitor.wantsRenew) {
      isCorrect = currentVisitor.isExpired ? (action === 'approve') : (action === 'deny');
    } else {
      isCorrect = currentVisitor.isExpired ? (action === 'deny') : (action === 'approve');
    }

    if (isCorrect) {
      showMessage("Верно! Босс доволен.", "green");
      anger = Math.max(0, anger - 10);
    } else {
      showMessage("ОШИБКА! Босс в ярости!", "red");
      anger += 15;
      energy -= 10;
    }

    energy -= 2;
    updateStats();
    
    if (anger >= 100 || energy <= 0) { endGame(); return; }

    document.getElementById('btn-approve').disabled = true;
    document.getElementById('btn-deny').disabled = true;
    document.getElementById('btn-ask-name').disabled = true;
    
    setTimeout(() => {
      document.getElementById('btn-approve').disabled = false;
      document.getElementById('btn-deny').disabled = false;
      document.getElementById('btn-ask-name').disabled = false;
      generateVisitor();
    }, 1500);
  };

  // === МЕХАНИКА МИНИ-ИГР ===
  function startMiniGame(type, employeeName, taskCard) {
    isPaused = true;
    taskCard.remove(); // Убираем карточку, так как мы уже в мини-игре
    
    const screen = document.getElementById('minigame-screen');
    const title = document.getElementById('minigame-title');
    const area = document.getElementById('minigame-area');
    const targetText = document.getElementById('minigame-target');
    
    screen.style.display = 'flex';
    area.innerHTML = '';
    
    let requiredClicks = 0;
    let currentClicks = 0;
    
    if (type === 'papers') {
      title.textContent = `Альфред: «Подшей эти отчеты, стажёр.»`;
      requiredClicks = 5;
      for (let i = 0; i < 5; i++) {
        const paper = document.createElement('div');
        paper.className = 'minigame-object';
        paper.textContent = 'Отчет';
        paper.onclick = () => {
          if (!paper.classList.contains('done')) {
            paper.classList.add('done');
            currentClicks++;
            updateTarget();
          }
        };
        area.appendChild(paper);
      }
      addMiniChar(area, '#b0bec5', 'Альфред'); // Серый пиджак
    } 
    else if (type === 'sugar') {
      title.textContent = `Эвелин: «Принеси сахар из шкафа, пожалуйста.»`;
      requiredClicks = 3;
      for (let i = 0; i < 3; i++) {
        const sugar = document.createElement('div');
        sugar.className = 'minigame-object';
        sugar.textContent = 'Сахар';
        sugar.style.background = '#fff';
        sugar.onclick = () => {
          if (!sugar.classList.contains('done')) {
            sugar.classList.add('done');
            currentClicks++;
            updateTarget();
          }
        };
        area.appendChild(sugar);
      }
      addMiniChar(area, '#1b5e20', 'Эвелин'); // Зеленый шарф
    }
    else if (type === 'archive') {
      title.textContent = `Нетц: «Проверь архив, там всё в порядке?»`;
      requiredClicks = 4;
      for (let i = 0; i < 4; i++) {
        const file = document.createElement('div');
        file.className = 'minigame-object';
        file.textContent = 'Файл';
        file.style.background = '#d2a68a'; // Цвет папки
        file.onclick = () => {
          if (!file.classList.contains('done')) {
            file.classList.add('done');
            currentClicks++;
            updateTarget();
          }
        };
        area.appendChild(file);
      }
      addMiniChar(area, '#3e2723', 'Нетц'); // Коричневый пиджак
    }
    else if (type === 'spoon') {
      title.textContent = `Бернадетт: «Проверь ложку в ящике. Она тёплая.»`;
      requiredClicks = 1;
      const spoon = document.createElement('div');
      spoon.className = 'minigame-object';
      spoon.textContent = 'Ложка';
      spoon.style.background = '#ccc';
      spoon.onclick = () => {
        if (!spoon.classList.contains('done')) {
          spoon.classList.add('done');
          currentClicks++;
          updateTarget();
        }
      };
      area.appendChild(spoon);
      addMiniChar(area, '#333', 'Бернадетт'); // Темная одежда
    }
    else if (type === 'smoke') {
      title.textContent = `Ваня: «Пойдём покурим?»`;
      requiredClicks = 1;
      const cig = document.createElement('div');
      cig.className = 'minigame-object';
      cig.textContent = 'Курить';
      cig.style.background = '#f44336';
      cig.onclick = () => {
        if (!cig.classList.contains('done')) {
          cig.classList.add('done');
          currentClicks++;
          updateTarget();
        }
      };
      area.appendChild(cig);
      addMiniChar(area, '#4e342e', 'Ваня'); // Каштановые волосы
    }

    function updateTarget() {
      targetText.textContent = `Цель: ${currentClicks} / ${requiredClicks}`;
      if (currentClicks >= requiredClicks) {
        setTimeout(() => {
          screen.style.display = 'none';
          isPaused = false;
          showMessage("Поручение выполнено!", "green");
          anger = Math.max(0, anger - 5);
          updateStats();
        }, 500);
      }
    }
    updateTarget();
  }

  // Вспомогательная функция для добавления пиксельного сотрудника в мини-игру
  function addMiniChar(area, bodyColor, name) {
    const char = document.createElement('div');
    char.className = 'mini-char';
    
    let hairColor = '#4e342e';
    if (name === 'Эвелин') hairColor = '#e8c77a';
    if (name === 'Нетц') hairColor = '#1a1a1a';
    
    char.innerHTML = `
      <div class="body" style="background: ${bodyColor};"></div>
      <div class="head"></div>
      <div class="hair" style="background: ${hairColor};"></div>
    `;
    area.appendChild(char);
  }

  // === ЗАДАНИЯ ===
  function spawnTask() {
    if (isGameOver || isPaused) return;
    const tasksEl = document.getElementById('tasks');
    
    const taskData = [
      {
        text: "Ваня: «Стажёр, пойдём покурим? А то тут душно.»",
        options: [
          { label: "Пойти", minigame: 'smoke', effect: () => { energy -= 15; anger = Math.max(0, anger - 10); } },
          { label: "Отказаться", effect: () => { anger += 5; showMessage("Ваня обиделся.", "red"); } }
        ]
      },
      {
        text: "Бернадетт: «Стажёр, проверь, не шевелится ли ложка в ящике.»",
        options: [
          { label: "Проверить", minigame: 'spoon', effect: () => { energy -= 5; } },
          { label: "Игнорировать", effect: () => { anger += 15; showMessage("Бернадетт обиделась. И ложка тоже.", "red"); } }
        ]
      },
      {
        text: "Альфред: «Стажёр, подшей отчет за вчерашний день. Срочно.»",
        options: [
          { label: "Подшить", minigame: 'papers', effect: () => { energy -= 10; } },
          { label: "Сказать 'потом'", effect: () => { anger += 10; showMessage("Альфред записал это в личное дело.", "red"); } }
        ]
      },
      {
        text: "Эвелин: «Стажёр, принеси сахар из шкафа, пожалуйста.»",
        options: [
          { label: "Принести", minigame: 'sugar', effect: () => { energy -= 5; } },
          { label: "Отказаться", effect: () => { anger += 5; showMessage("Эвелин вздохнула.", "red"); } }
        ]
      },
      {
        text: "Нетц: «Стажёр, зайди в архив, посмотри, там все в порядке?»",
        options: [
          { label: "Сходить", minigame: 'archive', effect: () => { energy -= 15; } },
          { label: "Сказать, что занят", effect: () => { anger += 5; showMessage("Нетц подозрительно прищурился.", "red"); } }
        ]
      }
    ];

    const data = taskData[Math.floor(Math.random() * taskData.length)];
    const task = document.createElement('div');
    task.className = 'task-card';
    
    let buttonsHTML = data.options.map((opt, index) => 
      `<button onclick="handleTaskClick(${index}, this)">${opt.label}</button>`
    ).join('');

    task.innerHTML = `
      <div class="task-text">${data.text}</div>
      <div class="task-buttons">${buttonsHTML}</div>
    `;
    
    task._options = data.options;
    task._originalText = data.text;
    tasksEl.appendChild(task);

    setTimeout(() => {
      if (task.parentNode && !isPaused) {
        task.remove();
        anger += 10;
        showMessage("Поручение провалено!", "red");
        updateStats();
      }
    }, 20000);
  }

  // Обработка клика по кнопке в задании
  window.handleTaskClick = function(index, btn) {
    const task = btn.closest('.task-card');
    if (!task) return;
    
    const option = task._options[index];
    
    if (option.minigame) {
      // Запуск мини-игры
      const employeeName = task._originalText.split(':')[0];
      startMiniGame(option.minigame, employeeName, task);
    } else {
      // Обычное действие
      if (option.effect) option.effect();
      task.remove();
      updateStats();
    }
  };

  function showMessage(text, color) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.style.backgroundColor = color === 'red' ? '#cc0000' : '#006600';
    msg.style.display = 'block';
    document.getElementById('desk').classList.add(color === 'red' ? 'flash-red' : 'flash-green');
    setTimeout(() => {
      msg.style.display = 'none';
      document.getElementById('desk').classList.remove('flash-red', 'flash-green');
    }, 1500);
  }

  function updateStats() {
    document.getElementById('energy-fill').style.width = Math.max(0, energy) + '%';
    document.getElementById('anger-fill').style.width = Math.min(100, anger) + '%';
    if (energy < 30) document.getElementById('energy-fill').style.background = '#ff3333';
    else document.getElementById('energy-fill').style.background = '#00ff00';

    const hours = Math.floor(timeMinutes / 60);
    const mins = timeMinutes % 60;
    document.getElementById('time-display').textContent = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
  }

  setInterval(() => {
    if (isGameOver || isPaused) return; // Таймер стоит, пока идет мини-игра
    timeMinutes += 1;
    if (timeMinutes >= 18 * 60) { endGame(true); return; }
    if (timeMinutes % 10 === 0) {
      energy -= 1; updateStats();
      if (energy <= 0) endGame();
    }
  }, 100);

  setInterval(() => {
    if (!isGameOver && !isPaused && Math.random() < 0.4) spawnTask();
  }, 8000);

  function endGame(isWin = false) {
    isGameOver = true;
    const go = document.getElementById('gameover');
    go.style.display = 'flex';
    if (isWin) {
      go.querySelector('h1').textContent = "СМЕНА ОКОНЧЕНА";
      go.querySelector('h1').style.color = "#00ff00";
      document.getElementById('gameover-text').textContent = "Вы дожили до 18:00. Мистер Морриган даже не заметил вашего существования.";
    } else {
      go.querySelector('h1').textContent = "ВЫ УВОЛЕНЫ";
      go.querySelector('h1').style.color = "#f44336";
      document.getElementById('gameover-text').textContent = energy <= 0 ? "Вы уснули на рабочем месте." : "Слишком много ошибок. Босс не прощает.";
    }
  }

  generateVisitor();
  updateStats();
</script>
</body>
</html>
